<!DOCTYPE html>
<html lang="uk"

<head th:replace="~{layout :: head('Головна | SpringAPI')}"></head>

<body class="min-h-screen bg-slate-950 text-white flex flex-col">

<header th:replace="~{layout :: navbar}"></header>


<main class="flex-1">

                <a href="/register"
