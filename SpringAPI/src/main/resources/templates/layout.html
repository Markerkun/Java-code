<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">SpringAPI</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white flex flex-col">

<!-- NAVBAR -->
<header th:fragment="navbar"
        class="border-b border-slate-800 bg-slate-950">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <nav class="h-16 flex items-center justify-between">

            <!-- Logo -->
            <a href="/"
               class="flex items-center gap-2">

                <div class="w-9 h-9 rounded-xl
                            bg-blue-600
                            flex items-center justify-center
                            font-bold">
                    S
                </div>

                <span class="text-xl font-bold">
                    SpringAPI
                </span>

            </a>


            <!-- Links -->
            <div class="flex items-center gap-2">

                <a href="/"
                   class="px-4 py-2 rounded-lg
                          text-slate-300
                          hover:text-white
                          hover:bg-slate-800
                          transition">
                    Головна
                </a>

                <a href="/login"
                   class="px-4 py-2 rounded-lg
                          text-slate-300
                          hover:text-white
                          hover:bg-slate-800
                          transition">
                    Увійти
                </a>

                <a href="/register"
                   class="px-4 py-2 rounded-lg
                          bg-blue-600
                          hover:bg-blue-700
                          transition">
                    Реєстрація
                </a>

            </div>

        </nav>

    </div>

</header>


<!-- FOOTER -->
<footer th:fragment="footer"
        class="border-t border-slate-800 bg-slate-950 mt-auto">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="py-6
                    flex flex-col
                    sm:flex-row
                    items-center
                    justify-between
                    gap-3">

            <p class="text-sm text-slate-500">
                © 2026 SpringAPI
            </p>

            <div class="flex gap-5">

                <a href="/"
                   class="text-sm text-slate-500
                          hover:text-white">
                    Головна
                </a>

                <a href="/login"
                   class="text-sm text-slate-500
                          hover:text-white">
                    Вхід
                </a>

                <a href="/register"
                   class="text-sm text-slate-500
                          hover:text-white">
                    Реєстрація
                </a>

            </div>

        </div>

    </div>

</footer>

</body>
</html>
