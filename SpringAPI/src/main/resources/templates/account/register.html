<!DOCTYPE html>
<html lang="uk"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout}">

<head>
    <title>Реєстрація | QRGenerator</title>
</head>

<body>

<div layout:fragment="content">

    <div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-gray-800">
                    Створення акаунта
                </h1>

                <p class="text-gray-500 mt-2">
                    Зареєструйтесь, щоб користуватися QRGenerator
                </p>

            </div>

            <div th:if="${error}"
                 class="mb-5 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700"
                 th:text="${error}">
            </div>

            <form th:action="@{/register}"
                  method="post"
                  class="space-y-5">

                <div>
                    <label for="username"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Ім'я користувача
                    </label>

                    <input id="username"
                           type="text"
                           name="username"
                           required
                           minlength="3"
                           placeholder="Введіть ім'я користувача"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label for="email"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input id="email"
                           type="email"
                           name="email"
                           required
                           placeholder="example@gmail.com"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label for="password"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Пароль
                    </label>

                    <input id="password"
                           type="password"
                           name="password"
                           required
                           minlength="6"
                           placeholder="Введіть пароль"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label for="confirmPassword"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Підтвердження пароля
                    </label>

                    <input id="confirmPassword"
                           type="password"
                           name="confirmPassword"
                           required
                           minlength="6"
                           placeholder="Повторіть пароль"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl
                                  focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit"
                        class="w-full py-3.5 bg-indigo-600 text-white rounded-xl
                               font-semibold hover:bg-indigo-700 transition">
                    Зареєструватися
                </button>

            </form>

            <p class="text-center text-gray-500 mt-6">
                Вже маєте акаунт?
                <a th:href="@{/login}"
                   class="text-indigo-600 hover:text-indigo-700 font-semibold">
                    Увійти
                </a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
