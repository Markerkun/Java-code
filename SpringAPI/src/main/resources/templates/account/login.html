<!DOCTYPE html>
<html lang="uk"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout}">

<head>
    <title>Вхід | QRGenerator</title>
</head>

<body>

<div layout:fragment="content">

    <div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

            <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">
                Вхід
            </h1>

            <p class="text-gray-500 text-center mb-8">
                Увійдіть до свого акаунта
            </p>

            <form th:action="@{/login}" method="post" class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Логін
                    </label>

                    <input type="text"
                           name="username"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Пароль
                    </label>

                    <input type="password"
                           name="password"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button type="submit"
                        class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">
                    Увійти
                </button>

            </form>

            <p class="text-center text-gray-500 mt-6">
                Немає акаунта?
                <a th:href="@{/register}"
                   class="text-indigo-600 hover:text-indigo-700 font-medium">
                    Зареєструватися
                </a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
